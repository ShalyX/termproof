name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Full test suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Validate Sites artifact
        run: npm run validate:artifact
      - name: Validate Vercel build
        run: npm run vercel-build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
