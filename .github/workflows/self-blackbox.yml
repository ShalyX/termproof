name: Termproof self black-box

on:
  push:
    branches:
      - ops/self-blackbox
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  self-blackbox:
    runs-on: ubuntu-latest
    steps:
      - name: Run live Termproof vs Termproof verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof

          API='https://termproof-mauve.vercel.app/api/verify'
          REPO='https://github.com/ShalyX/termproof'
          TECHNICAL='Termproof has a public implementation repository containing package.json, src/agent/provider-planner.ts, src/core/policy.ts, src/core/postgres-persistence.ts, and src/app/api/verify/route.ts. Its production website at https://termproof-mauve.vercel.app returns HTTP 200. Its production verification API at https://termproof-mauve.vercel.app/api/verify returns HTTP 405 to a GET request.'
          BEHAVIORAL='Termproof is a working AI agent that takes a technical milestone and project evidence source, uses an AI planner to produce bounded evidence checks, executes supported live evidence adapters, and returns a deterministic milestone disposition.'

          run_one() {
            local name="$1"
            local milestone="$2"
            jq -n \
              --arg mode start \
              --arg milestone "$milestone" \
              --arg githubRepository "$REPO" \
              '{mode:$mode,milestone:$milestone,githubRepository:$githubRepository}' \
              > "proof/${name}-request.json"

            local status
            status=$(curl -sS -o "proof/${name}-response.raw.json" -w '%{http_code}' \
              -H 'content-type: application/json' \
              -H "x-request-id: termproof-self-blackbox-${name}-20260820" \
              --data-binary @"proof/${name}-request.json" \
              "$API")

            printf '%s\n' "$status" > "proof/${name}-http-status.txt"
            jq . "proof/${name}-response.raw.json" > "proof/${name}-response.json"
            jq '{caseId,version,verdict,releaseRecommendation,coverageSummary,acceptanceTerms,evidenceRequests,claims,planner,error,code}' \
              "proof/${name}-response.json" > "proof/${name}-summary.json"
            echo "===== ${name} / HTTP ${status} ====="
            cat "proof/${name}-summary.json"
          }

          run_one technical "$TECHNICAL"
          run_one behavioral "$BEHAVIORAL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termproof-self-blackbox
          path: proof
          retention-days: 1
