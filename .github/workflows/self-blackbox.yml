name: Termproof self black-box

on:
  push:
    branches:
      - ops/self-blackbox

permissions:
  contents: read

jobs:
  self-blackbox:
    runs-on: ubuntu-latest
    steps:
      - name: Run live Termproof vs Termproof verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof

          API='https://termproof-mauve.vercel.app/api/verify'
          REPO='https://github.com/ShalyX/termproof'
          MILESTONE='Termproof has a public implementation repository containing package.json, src/agent/provider-planner.ts, src/core/policy.ts, src/core/postgres-persistence.ts, and src/app/api/verify/route.ts. Its production website at https://termproof-mauve.vercel.app returns HTTP 200. Its production verification API at https://termproof-mauve.vercel.app/api/verify rejects GET with HTTP 405. Termproof is a working AI agent that takes a technical milestone and project evidence source, uses an AI planner to produce bounded evidence checks, executes supported live evidence adapters, and returns a deterministic milestone disposition.'

          jq -n \
            --arg mode start \
            --arg milestone "$MILESTONE" \
            --arg githubRepository "$REPO" \
            '{mode:$mode,milestone:$milestone,githubRepository:$githubRepository}' \
            > proof/request.json

          STATUS=$(curl -sS -o proof/response.raw.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'x-request-id: termproof-self-blackbox-20260820' \
            --data-binary @proof/request.json \
            "$API")

          printf '%s\n' "$STATUS" > proof/http-status.txt
          jq . proof/response.raw.json > proof/response.json
          jq '{caseId,version,verdict,releaseRecommendation,coverageSummary,acceptanceTerms,evidenceRequests,claims,planner}' proof/response.json > proof/summary.json
          cat proof/summary.json
          test "$STATUS" = '200'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termproof-self-blackbox
          path: proof
          retention-days: 1
