name: Video capture source artifact

on:
  push:
    branches:
      - ops/video-capture
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Package exact main source
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/termproof-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: termproof-source
          path: ${{ runner.temp }}/termproof-source.tar.gz
          retention-days: 1

  production-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Capture real production verification responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo-proof
          API='https://termproof-mauve.vercel.app/api/verify'
          REPO='https://github.com/ShalyX/mandate-closeout-agent'
          GOOD='Mandate has a public implementation repository containing contracts/MandateVault.sol, contracts/MandateFactory.sol, src/agent/planner.mjs, and api/health.mjs. Its production health endpoint at https://mandate-closeout.vercel.app/api/health returns HTTP 200 with valid JSON where ok equals true and service equals mandate.'
          BAD='Mandate has a public implementation repository containing contracts/MandateVault.sol, contracts/MandateFactory.sol, src/agent/planner.mjs, and api/health.mjs. Its production health endpoint at https://mandate-closeout.vercel.app/api/health returns HTTP 200 with valid JSON where ok equals true and service equals mandate-agent.'
          MISS='A public HTTPS health endpoint, whose URL must be supplied as evidence, returns HTTP 200.'

          jq -n --arg milestone "$GOOD" --arg githubRepository "$REPO" '{milestone:$milestone,githubRepository:$githubRepository}' > /tmp/good.json
          curl --fail-with-body -sS -H 'content-type: application/json' --data-binary @/tmp/good.json "$API" | tee demo-proof/verified.json | jq -e '.verdict == "VERIFIED"' >/dev/null

          jq -n --arg milestone "$BAD" --arg githubRepository "$REPO" '{milestone:$milestone,githubRepository:$githubRepository}' > /tmp/bad.json
          curl --fail-with-body -sS -H 'content-type: application/json' --data-binary @/tmp/bad.json "$API" | tee demo-proof/failed.json | jq -e '.verdict == "FAILED"' >/dev/null

          jq -n --arg mode start --arg milestone "$MISS" --arg githubRepository "$REPO" '{mode:$mode,milestone:$milestone,githubRepository:$githubRepository}' > /tmp/start.json
          curl --fail-with-body -sS -H 'content-type: application/json' -H 'x-request-id: demo-video-start' --data-binary @/tmp/start.json "$API" | tee demo-proof/needs.json | jq -e '.verdict == "NEEDS_EVIDENCE"' >/dev/null

          CASE_ID=$(jq -r '.caseId' demo-proof/needs.json)
          CLAIM_ID=$(jq -r '.evidenceRequests[0].claimId' demo-proof/needs.json)
          STEP_ID=$(jq -r '.evidenceRequests[0].stepId' demo-proof/needs.json)
          jq -n --arg mode resume --arg caseId "$CASE_ID" --arg claimId "$CLAIM_ID" --arg stepId "$STEP_ID" --arg url 'https://mandate-closeout.vercel.app/api/health' '{mode:$mode,caseId:$caseId,evidence:{kind:"http_source",claimId:$claimId,stepId:$stepId,url:$url}}' > /tmp/resume.json
          curl --fail-with-body -sS -H 'content-type: application/json' -H 'x-request-id: demo-video-resume' -H 'idempotency-key: demo-video-resume-v1' --data-binary @/tmp/resume.json "$API" | tee demo-proof/resumed.json | jq -e '.verdict == "VERIFIED"' >/dev/null

          jq -n '{verified: input, failed: input}' >/dev/null
          for f in demo-proof/*.json; do jq . "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: demo-proof
          path: demo-proof
          retention-days: 1
