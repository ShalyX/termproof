name: v12.4 durable runtime sync

on:
  push:
    branches:
      - v12.4-durable-runtime-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.4-durable-runtime-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile for restored runtime dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if needed
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh lockfile for v12.4 runtime"
            git push origin HEAD:v12.4-durable-runtime-sync
          fi
      - name: Clean install
        run: npm ci
      - name: Core tests
        run: npm run test:core
      - name: Lint
        run: npm run lint
      - name: Vercel build
        run: npm run vercel-build
